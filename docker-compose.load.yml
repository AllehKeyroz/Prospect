# Carga única da Receita completa direto no PostgreSQL do EasyPanel.
#
# Por que Compose: roda como um container descartável, mostra log em tempo real
# e não depende do serviço da API estar de pé. Ao terminar, o container sai.
#
# No EasyPanel:
#   1. New Service -> Compose
#   2. Source: GitHub AllehKeyroz/Prospect, branch master, arquivo
#      docker-compose.load.yml
#   3. Environment: DATABASE_URL=postgres://...
#   4. Deploy e acompanhe os logs.
#
# Precisa de ~40 GB livres (7,3 GB de ZIP + 26 GB de CSV) e do Postgres
# acessível pelo hostname interno (ex.: sistemas_prospect-db).

services:
  load:
    image: ghcr.io/allehkeyroz/prospect:latest
    command:
      - sh
      - -c
      - npm run prepare:snapshot && npm run db:load:snapshot
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DATA_DIR: /data
      SNAPSHOT: ${SNAPSHOT:-2026-10}
      ARIA2_CONNECTIONS: ${ARIA2_CONNECTIONS:-16}
      ARIA2_JOBS: ${ARIA2_JOBS:-4}
      PG_LOAD_MAINTENANCE_MEM: ${PG_LOAD_MAINTENANCE_MEM:-512MB}
      PG_LOAD_WORK_MEM: ${PG_LOAD_WORK_MEM:-128MB}
    volumes:
      - load_data:/data
    restart: "no"

volumes:
  load_data:
