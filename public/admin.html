<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Prospect · Administração da base</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0b1016; color: #e6edf3;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px; border-bottom: 1px solid #1c2733;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid #2a3a4a; }
    .ok { color: #4ade80; border-color: #14532d; background: #052e16; }
    .bad { color: #f87171; border-color: #7f1d1d; background: #2a0d0d; }
    main { padding: 24px; display: grid; gap: 20px; max-width: 1100px; }
    section { border: 1px solid #1c2733; border-radius: 10px; padding: 16px 18px; background: #0e141b; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8b9bb0; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .stat { background: #0b1016; border: 1px solid #1c2733; border-radius: 8px; padding: 10px 12px; }
    .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: #8b9bb0; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 8px;
      padding: 9px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: #18212b; border: 1px solid #2a3a4a; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .bar { height: 8px; background: #16202b; border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: #2563eb; width: 0; transition: width .3s; }
    pre {
      margin: 0; max-height: 420px; overflow: auto; background: #070b10;
      border: 1px solid #1c2733; border-radius: 8px; padding: 12px;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap;
    }
    .meta { font-size: 12px; color: #8b9bb0; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  </style>
</head>
<body>
  <header>
    <h1>Administração da base</h1>
    <span id="db" class="pill">verificando…</span>
    <span id="jobst" class="pill">sem carga</span>
    <a href="/" style="margin-left:auto;color:#8b9bb0;font-size:12px">voltar ao app</a>
  </header>

  <main>
    <section>
      <h2>Base atual</h2>
      <div class="grid" id="counts"></div>
      <p class="meta" id="meta" style="margin:12px 0 0"></p>
    </section>

    <section>
      <h2>Arquivos do snapshot</h2>
      <div class="row" style="margin-bottom:8px">
        <span class="meta" id="files-label">—</span>
        <span class="meta" id="files-size"></span>
      </div>
      <div class="bar"><i id="files-bar"></i></div>
    </section>

    <section>
      <h2>Ações</h2>
      <div class="actions">
        <button data-kind="migrate" class="secondary">Aplicar migrações</button>
        <button data-kind="download" class="secondary">Baixar e extrair</button>
        <button data-kind="load" class="secondary">Carregar no Postgres</button>
        <button data-kind="all">Baixar + extrair + carregar</button>
      </div>
      <p class="meta" style="margin:12px 0 0">
        Cada ação roda em segundo plano e pode levar horas. O log abaixo acompanha ao vivo.
      </p>
    </section>

    <section>
      <h2>Log da carga</h2>
      <div class="row" style="margin-bottom:8px">
        <span class="meta" id="job-label">nenhuma execução</span>
        <span class="meta" id="job-time"></span>
      </div>
      <pre id="log">aguardando…</pre>
    </section>
  </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
