# App Prospect rodando dentro da rede do Supabase self-hosted.
#
# O Compose do EasyPanel cria a própria rede; para falar com o Postgres do
# Supabase é preciso entrar na rede dele. O nome segue o padrão do Docker
# Compose: <projeto>_<serviço>_default.
#
# No EasyPanel:
#   1. Environment: DATABASE_URL=postgres://postgres:SENHA@db:5432/postgres?sslmode=disable
#   2. Domains: apontar para o serviço `app`, porta 3000
#   3. Abrir https://SEU-DOMINIO/admin

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/src/api/server.js']
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      DATA_DIR: /data
      DUCKDB_PATH: /data/cnpj.duckdb
      APP_DB_PATH: /data/app.duckdb
      DUCKDB_TEMP_DIR: /data/tmp
      SNAPSHOT: ${SNAPSHOT:-2026-10}
      USE_ARIA2: ${USE_ARIA2:-false}
      DOWNLOAD_PARALLEL: ${DOWNLOAD_PARALLEL:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - load_data:/data
    restart: unless-stopped
    # Duas redes: a padrão do Compose (por onde o Traefik alcança o app) e a
    # do Supabase (por onde o app alcança o Postgres em `db`).
    networks:
      - default
      - supabase

networks:
  supabase:
    external: true
    name: ${EASYPANEL_NETWORK:-sistemas_prospects-supabase_default}

volumes:
  load_data:
