# Prospect — stack único (app + Postgres) para o EasyPanel.
#
# Um serviço, uma rede, sem dependência de outro stack. É a configuração que já
# rodou de forma estável neste servidor.
#
# No EasyPanel:
#   1. Environment: POSTGRES_PASSWORD (ou deixe o padrão abaixo)
#   2. Domains: apontar para o serviço `app`, porta 3000
#   3. Abrir https://SEU-DOMINIO/admin
#
# A migração para o Supabase self-hosted depois é pg_dump/pg_restore: o schema e
# os dados são Postgres puro.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prospect
      POSTGRES_USER: prospect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospect_local_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prospect -d prospect']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://prospect:${POSTGRES_PASSWORD:-prospect_local_dev}@db:5432/prospect?sslmode=disable
      DATA_DIR: /data
      DUCKDB_PATH: /data/cnpj.duckdb
      APP_DB_PATH: /data/app.duckdb
      DUCKDB_TEMP_DIR: /data/tmp
      SNAPSHOT: ${SNAPSHOT:-2026-10}
      USE_ARIA2: ${USE_ARIA2:-false}
      DOWNLOAD_PARALLEL: ${DOWNLOAD_PARALLEL:-2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - load_data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  load_data:
