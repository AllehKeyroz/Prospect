# Prospect — deploy mínimo.
#
# Um único serviço. Não exige .env, não exige Supabase, não exige Postgres.
# Sem banco, a API sobe em modo degradado: a UI abre, /health responde 200 e
# /admin mostra o estado da base. Os dados entram depois.
#
# No EasyPanel:
#   1. New Service -> Compose
#   2. Repositório AllehKeyroz/Prospect, branch master, arquivo docker-compose.yml
#   3. Deploy
#   4. Domains -> serviço `app`, porta 3000
#
# Variáveis são todas opcionais.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /data
      SNAPSHOT: ${SNAPSHOT:-2026-10}
      # Sem valor por padrão: a administração fica desligada até existir banco.
      DATABASE_URL: ${DATABASE_URL:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - app_data:/data
    restart: unless-stopped
    # Porta publicada para diagnóstico direto (IP:3001). O domínio usa a 3000.
    ports:
      - '3001:3000'

volumes:
  app_data:
