name: docker-publish

# Publica as duas imagens no GitHub Container Registry (ghcr.io):
#   latest -> Dockerfile (modo diagnóstico, sem banco)
#   full   -> Dockerfile.full (aplicação completa com DuckDB)
#
# No EasyPanel:
#   Source = Docker Image
#   Image  = ghcr.io/allehkeyroz/prospect:latest   (sem banco)
#   Port   = 3000

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (minimal, sem banco)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/allehkeyroz/prospect:latest
            ghcr.io/allehkeyroz/prospect:${{ github.sha }}

      - name: Build e push (full, com DuckDB)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.full
          push: true
          tags: |
            ghcr.io/allehkeyroz/prospect:full
