name: docker-publish

# Publica a imagem pronta no GitHub Container Registry (ghcr.io).
# Serve para o EasyPanel rodar a imagem sem depender do build no servidor:
#   Source = Docker Image
#   Image  = ghcr.io/allehkeyroz/prospect:latest
#   Port   = 3000

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/allehkeyroz/prospect:latest
            ghcr.io/allehkeyroz/prospect:${{ github.sha }}
