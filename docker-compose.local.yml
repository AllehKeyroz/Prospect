services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.full
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DUCKDB_PATH: /data/cnpj.duckdb
      APP_DB_PATH: /data/app.duckdb
      DUCKDB_TEMP_DIR: /data/tmp
      DATA_DIR: /data
      MEMORY_LIMIT: 2GB
      THREADS: 4
      SNAPSHOT: 2026-10
    volumes:
      - ./data:/data
    mem_limit: 4g
    restart: unless-stopped
